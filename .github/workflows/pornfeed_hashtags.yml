name: Pornfeed Hashtag Bot

on:
  workflow_dispatch:

jobs:
  repost:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install atproto

      - run: python pornfeed_hashtags.py
        env:
          BSKY_USERNAME_PORNFEED: ${{ secrets.BSKY_USERNAME_PORNFEED }}
          BSKY_PASSWORD_PORNFEED: ${{ secrets.BSKY_PASSWORD_PORNFEED }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_pornfeed.json
          git diff --cached --quiet || git commit -m "Update hashtag state"
          git push